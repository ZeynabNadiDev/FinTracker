name: FinTracker CI
on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore FinTracker.slnx
    - name: Build
      run: dotnet build FinTracker.slnx --no-restore -c Release
    - name: Test
      run: dotnet test FinTracker.slnx --no-build -c Release --verbosity normal
